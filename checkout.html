<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KOVA - Checkout</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="kova-header">

    <a href="shop.html">
        <img
            src="./Kova-UI-Kit/02-assets/logo/kova-lockup.svg"
            alt="KOVA"
            width="110"
        >
    </a>

    <a href="cart.html">
        Back to Cart
    </a>

</header>


<main class="checkout-page">

    <h1>Checkout</h1>

    <form id="checkoutForm">

        <div class="checkout-field">

            <label for="fullName">
                Full Name
            </label>

            <input
                id="fullName"
                name="fullName"
                type="text"
                required
            >

        </div>


        <div class="checkout-field">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                required
            >

        </div>


        <div class="checkout-field">

            <label for="address">
                Address
            </label>

            <input
                id="address"
                name="address"
                type="text"
                required
            >

        </div>


        <div class="checkout-field">

            <label for="phone">
                Phone Number
            </label>

            <input
                id="phone"
                name="phone"
                type="tel"
                required
            >

        </div>


        <div class="checkout-field">

            <label for="payment">
                Payment Method
            </label>

            <select
                id="payment"
                name="payment"
                required
            >

                <option value="">
                    Select payment method
                </option>

                <option value="card">
                    Credit / Debit Card
                </option>

                <option value="transfer">
                    Bank Transfer
                </option>

                <option value="cash">
                    Cash on Delivery
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="kova-checkout-button"
        >
            Place Order
        </button>

    </form>

</main>


<script>

const checkoutForm =
    document.getElementById("checkoutForm");


checkoutForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* Clear the same cart storage used
           by Product Details Add to Cart */

        localStorage.removeItem(
            "kovaCartItems"
        );

        localStorage.removeItem(
            "kovaCart"
        );


        alert(
            "Order placed successfully! 🎉 Thank you for shopping with KOVA."
        );


        window.location.href =
            "order-success.html";

    }
);

</script>

</body>

</html>
