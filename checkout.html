<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOVA - Checkout</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            KOVA
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="#">
                Categories
            </a>

        </nav>

        <a href="cart.html" class="cart">
            🛒 Cart
        </a>

    </header>


    <!-- CHECKOUT -->

    <main class="checkout-page">

        <div class="breadcrumb">

            <a href="index.html">
                Home
            </a>

            /

            <a href="cart.html">
                Cart
            </a>

            / Checkout

        </div>


        <h1>
            Checkout
        </h1>


        <form id="checkoutForm" novalidate>

            <h2>
                Customer Information
            </h2>


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="address">
                Delivery Address
            </label>

            <input
                type="text"
                id="address"
                placeholder="Enter your address"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >


            <h2>
                Payment Method
            </h2>


            <select id="paymentMethod" required>

                <option value="">
                    Select payment method
                </option>

                <option value="card">
                    Card
                </option>

                <option value="transfer">
                    Bank Transfer
                </option>

                <option value="cash">
                    Cash on Delivery
                </option>

            </select>


            <button type="submit">
                Place Order
            </button>

        </form>

    </main>


    <!-- FOOTER -->

    <footer>

        <h3>
            KOVA
        </h3>

        <p>
            Your simple online marketplace.
        </p>

        <p>
            © 2026 KOVA. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>
const checkoutForm = document.querySelector("#checkoutForm");

checkoutForm.addEventListener("submit", function(event) {
    event.preventDefault();

    alert("Order placed successfully! 🎉 Thank you for shopping with KOVA.");

    localStorage.removeItem("kovaCart");

    window.location.href = "order-success.html";
});
</script>

</body>

</html>
