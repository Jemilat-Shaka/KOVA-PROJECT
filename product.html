<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOVA - Product Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            KOVA
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="#">Categories</a>
        </nav>

        <a href="cart.html" class="cart">
            🛒 Cart
        </a>

    </header>


    <!-- PRODUCT DETAILS -->

    <main class="product-page">

        <div class="breadcrumb">

            <a href="index.html">Home</a>

            /

            <a href="products.html">Products</a>

            / Product Details

        </div>


        <div class="product-details">

            <!-- PRODUCT IMAGE -->

            <div class="product-details-image">

                <div class="large-product-image"></div>

            </div>


            <!-- PRODUCT INFORMATION -->

            <div class="product-info">

                <p class="category">
                    Electronics
                </p>


                <h1>
                    Product Name
                </h1>


                <p class="product-price">
                    $0
                </p>


                <p class="product-description">
                    Product description will appear here.
                </p>


                <!-- QUANTITY -->

                <div class="quantity-box">

                    <label for="quantity">
                        Quantity:
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >

                </div>


                <!-- ADD TO CART -->

                <button id="addToCart" type="button">

                    Add to Cart

                </button>


                <br>
                <br>


                <a href="products.html">
                    ← Back to Products
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <h3>
            KOVA
        </h3>

        <p>
            Your simple online marketplace.
        </p>

        <p>
            © 2026 KOVA. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/script.js"></script>

</body>

</html>
